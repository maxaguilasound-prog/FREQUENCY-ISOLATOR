name: Build VST3
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target FrequencyIsolator_VST3
      - name: Package
        run: |
          mkdir -p artifact
          find build -type d -name '*.vst3' -print -exec cp -R {} artifact/ \;
          ditto -c -k --sequesterRsrc --keepParent artifact/ FrequencyIsolator-VST3-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FrequencyIsolator-VST3-macOS
          path: FrequencyIsolator-VST3-macOS.zip
