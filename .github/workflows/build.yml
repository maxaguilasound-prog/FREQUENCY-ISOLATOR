name: Build VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build VST3
        run: |
          cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release --target FrequencyIsolator_VST3

      - name: Package plugin
        run: |
          rm -rf artifact
          mkdir -p artifact
          find build -path "*/Release/VST3/Frequency Isolator.vst3" -type d -exec cp -R "{}" artifact/ \;
          test -d "artifact/Frequency Isolator.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FrequencyIsolator-VST3-macOS
          path: artifact/Frequency Isolator.vst3
          if-no-files-found: error
