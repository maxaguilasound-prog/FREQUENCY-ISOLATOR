name: Build VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build VST3
        run: |
          cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release --target FrequencyIsolator_VST3

      - name: Package plugin
        run: |
          rm -rf package FrequencyIsolator-VST3.zip
          mkdir -p package
          find build -path "*/Release/VST3/Frequency Isolator.vst3" -type d -exec cp -R "{}" package/ \;
          test -d "package/Frequency Isolator.vst3"
          ditto -c -k --keepParent "package/Frequency Isolator.vst3" FrequencyIsolator-VST3.zip
          unzip -l FrequencyIsolator-VST3.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FrequencyIsolator-VST3-ZIP
          path: FrequencyIsolator-VST3.zip
          if-no-files-found: error
