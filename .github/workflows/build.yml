name: Build VST3 + AAX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AAX SDK
        run: |
          curl -L \
            "https://cdn.avid.com/aax-toolkit/aax-sdk-2-9-0.zip" \
            -o "$RUNNER_TEMP/aax-sdk.zip"

          mkdir -p "$RUNNER_TEMP/aax-sdk"

          unzip -q "$RUNNER_TEMP/aax-sdk.zip" \
            -d "$RUNNER_TEMP/aax-sdk"

          echo "AAX SDK:"
          find "$RUNNER_TEMP/aax-sdk" -maxdepth 2 -type d | sort

      - name: Set AAX SDK path
        run: |
          SDK_PATH="$RUNNER_TEMP/aax-sdk/aax-sdk-2-9-0"

          if [ ! -d "$SDK_PATH" ]; then
            echo "Expected SDK path not found:"
            echo "$SDK_PATH"
            find "$RUNNER_TEMP/aax-sdk" -maxdepth 3 -print
            exit 1
          fi

          echo "AAX_SDK_PATH=$SDK_PATH" >> "$GITHUB_ENV"

          echo "Using AAX SDK:"
          echo "$SDK_PATH"

      - name: Configure
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DAAX_SDK_PATH="$AAX_SDK_PATH"

      - name: Build VST3
        run: |
          cmake --build build \
            --config Release \
            --target FrequencyIsolator_VST3

      - name: Build AAX
        run: |
          cmake --build build \
            --config Release \
            --target FrequencyIsolator_AAX

      - name: Locate plugins
        run: |
          echo "===== VST3 ====="
          find build -type d -name "*.vst3" -print

          echo "===== AAX ====="
          find build -type d -name "*.aaxplugin" -print

      - name: Package plugins
        run: |
          rm -rf package
          mkdir -p package

          VST3=$(find build \
            -type d \
            -name "Frequency Isolator.vst3" \
            -print -quit)

          AAX=$(find build \
            -type d \
            -name "Frequency Isolator.aaxplugin" \
            -print -quit)

          echo "VST3: $VST3"
          echo "AAX:  $AAX"

          test -n "$VST3"
          test -n "$AAX"

          cp -R "$VST3" package/
          cp -R "$AAX" package/

          ditto -c -k \
            --keepParent \
            package \
            FrequencyIsolator-macOS.zip

          echo "===== PACKAGE ====="
          unzip -l FrequencyIsolator-macOS.zip

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: FrequencyIsolator-macOS
          path: FrequencyIsolator-macOS.zip
          if-no-files-found: error
